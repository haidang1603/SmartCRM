version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartcrm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-smartcrm}
      MYSQL_USER: ${DB_USER:-smartcrm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-smartcrm_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smartcrm-network

  redis:
    image: redis:7-alpine
    container_name: smartcrm-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smartcrm-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smartcrm-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-smartcrm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartcrm_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - smartcrm-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcrm-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smartcrm}
      DB_USER: ${DB_USER:-smartcrm_user}
      DB_PASSWORD: ${DB_PASSWORD:-smartcrm_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-smartcrm}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smartcrm_password}
      JWT_SECRET: ${JWT_SECRET:-SmartCRMSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong2026!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      REPORT_STORAGE_DIR: /app/storage/reports
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    volumes:
      - reports_data:/app/storage/reports
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - smartcrm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcrm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_DEV_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - smartcrm-network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  reports_data:

networks:
  smartcrm-network:
    driver: bridge
