spring:
  datasource:
    url: jdbc:h2:mem:smartcrm_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  jwt:
    secret: SmartCRMSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong2026!
    expiration-ms: 86400000

logging:
  level:
    com.smartcrm: WARN
